[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-compiler"
version = "0.1.0"
description = "Local-first knowledge compilation pipeline for grounded retrieval."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pydantic",
  "python-dotenv",
  "typer",
]

[dependency-groups]
dev = [
  "pytest",
  "ty",
]

[project.scripts]
knowledge-compiler = "knowledge_compiler.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
